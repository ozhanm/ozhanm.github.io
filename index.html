<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Özhan Mengücek — Apps</title>
<meta name="description" content="Mobile apps and games by Özhan Mengücek.">
<style>
  :root { --bg: #F3F4F1; --card: #FFFFFF; --text: #1C2420; --muted: #5B6660; --accent: #15784A; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111613; --card: #1B221E; --text: #E8EDEA; --muted: #9AA6A0; --accent: #4CC38A; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 48px 16px }
  main { max-width: 640px; margin: 0 auto }
  h1 { font-size: 28px; line-height: 1.2 }
  .lead { color: var(--muted); margin-top: 6px }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 36px 0 12px }
  .app { background: var(--card); border-radius: 16px; padding: 20px }
  .app h3 { font-size: 20px }
  .app p { color: var(--muted); margin-top: 4px }
  .links { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 18px }
  a { color: var(--accent); font-weight: 600; text-decoration: none }
  a:hover { text-decoration: underline }
  footer { margin-top: 36px; color: var(--muted); font-size: 14px }
</style>
</head>
<body>
<main>
  <h1>Özhan Mengücek</h1>
  <p class="lead">Mobile apps and games for Android.</p>

  <h2>Apps</h2>
  <section class="app">
    <h3>Mahjong Showdown</h3>
    <p>1v1 emoji mahjong: play online, with a friend or against the bot.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.mahjongshowdown.app">Google Play</a>
      <a href="https://github.com/ozhanm/sozlesmeler/blob/master/mahjong-showdown-gizlilik-politikasi.md">Privacy policy</a>
    </div>
  </section>

  <footer>Contact: <a href="mailto:ozhanmengucek@gmail.com">ozhanmengucek@gmail.com</a></footer>
</main>
</body>
</html>
